name: CD

on:
  push:
    branches:
      - dev
      - homolog
      - prod
  workflow_dispatch:

jobs:
  DeployToAWS:
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set AWS Account ID and stack name
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_DEV }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "homolog" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_HOML }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "prod" ]]; then
            echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "Invalid branch name!" && exit 1
          fi
          echo "STACK_NAME=BattlesnakeArenaStack${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Debug target account (masked)
        run: |
          echo "account_len=${#AWS_ACCOUNT_ID}"
          echo "account_suffix=${AWS_ACCOUNT_ID: -4}"
      
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionsRole
          role-session-name: github-action
          retry-max-attempts: 2

      - name: Installing Dependencies
        run: |
          npm install -g aws-cdk@2.178.2
          cd iac
          pip install -r requirements.txt

      - name: DeployWithCDK
        run: |
          cd iac
          cdk synth
          cdk deploy --require-approval never
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ env.STACK_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          EC2_INSTANCE_TYPE: ${{ vars.EC2_INSTANCE_TYPE }}
