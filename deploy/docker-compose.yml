services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    volumes:
      - arena_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  arena:
    image: battlesnake-arena:local
    build:
      context: ../arena
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      # Public URL used by board.battlesnake.com iframe (engine=). Required in prod.
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD:-arena}@postgres:5432/${POSTGRES_DB:-arena}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      # How often the job worker looks for "Run Round" / game-start jobs.
      ARENA_JOB_POLL_INTERVAL_MS: ${ARENA_JOB_POLL_INTERVAL_MS:-500}
      ARENA_JOB_WORKERS: ${ARENA_JOB_WORKERS:-2}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M

  # Standby used only during blue/green deploys (profile bluegreen).
  # Lower memory so t3.medium (4GB) can briefly run both arenas + postgres.
  arena_next:
    profiles: ["bluegreen"]
    image: battlesnake-arena:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD:-arena}@postgres:5432/${POSTGRES_DB:-arena}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      ARENA_JOB_POLL_INTERVAL_MS: ${ARENA_JOB_POLL_INTERVAL_MS:-500}
      # Avoid double job workers while both containers are up.
      ARENA_JOB_WORKERS: "0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - arena
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.upstream:/etc/caddy/Caddyfile.upstream:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  arena_pg_data:
  caddy_data:
  caddy_config:
